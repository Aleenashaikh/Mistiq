<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link rel="apple-touch-icon" href="/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Primary Meta Tags (overridden per-page by react-helmet-async) -->
    <title>Mistiq Perfumeries - Luxury Fragrances</title>
    <meta name="title" content="Mistiq Perfumeries - Luxury Fragrances" />
    <meta name="description" content="Discover handcrafted luxury fragrances designed to match every personality. Shop premium perfumes with unique scents that tell your story." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.mistiq-perfumeries.com/" />
    <meta property="og:title" content="Mistiq Perfumeries - Luxury Fragrances" />
    <meta property="og:description" content="Discover handcrafted luxury fragrances designed to match every personality. Shop premium perfumes with unique scents that tell your story." />
    <meta property="og:image" content="https://www.mistiq-perfumeries.com/images/logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:site_name" content="Mistiq Perfumeries" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.mistiq-perfumeries.com/" />
    <meta name="twitter:title" content="Mistiq Perfumeries - Luxury Fragrances" />
    <meta name="twitter:description" content="Discover handcrafted luxury fragrances designed to match every personality. Shop premium perfumes with unique scents that tell your story." />
    <meta name="twitter:image" content="https://www.mistiq-perfumeries.com/images/logo.png" />

    <!-- Fallback canonical (react-helmet-async overrides per-page) -->
    <link rel="canonical" href="https://www.mistiq-perfumeries.com/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
